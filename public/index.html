<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thread Atlas</title><link rel="stylesheet" href="/style.css"></head><body><div class="app">
<aside class="rail"><div class="brand"><span class="mark" aria-hidden="true"></span>Thread Atlas</div>
<nav id="nav" aria-label="Views">
 <button class="navButton" data-view="map"><span class="navicon" aria-hidden="true">⌘</span><span data-label="map"></span><small id="mapCount"></small></button>
 <button class="navButton" data-view="active"><span class="navicon" aria-hidden="true">●</span><span data-label="active"></span><small id="activeCount"></small></button>
 <button class="navButton" data-view="inbox"><span class="navicon" aria-hidden="true">▤</span><span data-label="inbox"></span><small id="inboxCount"></small></button>
 <button id="hiddenDrop" class="navButton" data-view="hidden"><span class="navicon" aria-hidden="true">⊟</span><span data-label="hidden"></span><small id="hiddenCount"></small></button>
 <button class="navButton" data-view="excluded"><span class="navicon" aria-hidden="true">⊘</span><span data-label="excluded"></span><small id="excludedCount"></small></button>
</nav>
<div class="projects"><p class="sectionlabel" data-label="projects"></p><div id="projectList"></div></div>
<div class="utilities"><button id="connections">◌ <span data-label="connections"></span></button><button id="addGroup">＋ <span data-label="newGroup"></span></button><div class="locale" id="localePicker" role="group" aria-label="Language"><button lang="en" data-lang="en">English</button><button lang="ko" data-lang="ko">한국어</button></div><p class="sample" id="statusline"></p></div></aside>
<main><p class="breadcrumb"><b style="font-weight:inherit" data-label="workspace"></b> <span>/</span> <b style="font-weight:inherit" data-label="myWork"></b><b id="projectTrail" style="font-weight:inherit"></b></p><div class="intro"><div><h1 id="heading"></h1><p class="meta" id="summary"></p></div><div class="viewTools"><label class="visibilityFilter" id="visibilityFilter" hidden><input type="checkbox" id="showHidden"><span data-label="showHidden"></span></label><button class="tool" id="viewAction"></button></div></div><section id="canvas"></section><p class="hint" id="hint"></p></main>
<aside class="side" id="chatPanel"><div class="sidehead"><h2 data-label="mainChat"></h2><small id="activeScope"></small></div><div class="chat" id="chat" role="log" aria-live="polite"></div>
<form class="composer" id="composer"><div class="dest" id="dest"></div><div class="inputbox"><label for="prompt" data-label="message"></label><textarea id="prompt"></textarea><div class="composefoot"><select id="mode" aria-label="Message mode"><option value="auto">Auto</option><option value="find">Find</option><option value="send">Send</option></select><button class="send" type="submit"><span data-label="send"></span> ↑</button></div></div></form></aside>
</div><dialog id="dialog" aria-labelledby="dialogTitle"><div class="row"><h2 id="dialogTitle"></h2><button class="tool" id="closeDialog" data-label="close"></button></div><div id="dialogContent"></div></dialog><div class="toast" id="toast" role="status"></div><div id="projectDropPreview" role="status"></div>
<script type="module" src="/app.js"></script></body></html>
